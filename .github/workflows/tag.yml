name: Tag major-release
on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  tag-major:
    name: Push major-release
    runs-on: ubuntu-latest
    steps:
      - uses: Actions-R-Us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # latest
        with:
          publish_latest_tag: false